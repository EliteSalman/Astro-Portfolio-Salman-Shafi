version: "3.9"

services:
  portfolio:
    image: ghcr.io/elitesalman/nextjs-portfolio-salman-shafi:latest
    container_name: portfolio
    init: true
    security_opt:
      - no-new-privileges:true
      - label=type:container_runtime_t
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /opt/app-root/src/.next/cache:rw,size=128m,mode=0777
    pids_limit: 100
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
